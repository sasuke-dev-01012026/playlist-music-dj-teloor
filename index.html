<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DJ Teloor · Untuk Kamu</title>
  <meta name="theme-color" content="#fff4f7">

  <!-- Font & ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

  <style>
    /* Design tokens, reset, dan gaya global */

    :root {
      --bg: #fff4f7;
      --panel: #ffffff;
      --card: #ffffff;
      --card-h: #fdeaf0;
      --chip: #fdeaf0;
      --text: #3f2530;
      --muted: #8e6b79;
      --accent: #c94673;
      --accent-h: #b03760;
      --on-accent: #ffffff;
      --soft: #fbdde7;
      --hover: #fdeaf0;
      --line: #f5dbe4;
      --serif: "Playfair Display", Georgia, "Times New Roman", serif;
      --gap: 8px;
      --nav-h: 64px;
      --player-h: 84px;
      --side-w: 280px;
      --r: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Montserrat", system-ui, sans-serif;
      overflow: hidden;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
    }

    img {
      display: block;
      max-width: 100%;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Layout grid aplikasi (app shell) */

    .app {
      height: 100dvh;
      display: grid;
      gap: var(--gap);
      padding: var(--gap);
      grid-template-columns: var(--side-w) minmax(0, 1fr);
      grid-template-rows: var(--nav-h) minmax(0, 1fr) var(--player-h);
      grid-template-areas: "nav nav" "side main" "player player";
    }

    .nav {
      grid-area: nav;
    }

    .side {
      grid-area: side;
    }

    .main {
      grid-area: main;
    }

    .player-bar {
      grid-area: player;
    }

    /* Komponen Navbar: logo + pencarian */

    .nav {
      display: grid;
      grid-template-columns: 1fr minmax(0, 1.2fr) 1fr;
      align-items: center;
      gap: 16px;
      padding: 0 8px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px;
      color: var(--text);
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--on-accent);
      display: grid;
      place-items: center;
      font-size: 1rem;
      flex-shrink: 0;
      transition: .2s;
    }

    .logo-icon i {
      margin-left: 2px;
    }

    .logo:hover .logo-icon {
      background: var(--accent-h);
      transform: scale(1.06);
    }

    .logo-text {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -.01em;
      white-space: nowrap;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 48px;
      padding: 0 16px;
      border-radius: 999px;
      background: var(--chip);
      border: 2px solid transparent;
      color: var(--muted);
      transition: .2s;
    }

    .search:hover {
      background: var(--hover);
    }

    .search:focus-within {
      border-color: var(--accent);
      color: var(--text);
    }

    .search input {
      flex: 1;
      min-width: 0;
      background: none;
      border: 0;
      outline: 0;
      color: var(--text);
      font: 500 .95rem "Montserrat", sans-serif;
    }

    .nav-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }

    .nav-link {
      padding: 8px 12px;
      font-weight: 600;
      font-size: .9rem;
      color: var(--muted);
      white-space: nowrap;
      transition: .15s;
    }

    .nav-link:hover {
      color: var(--text);
      transform: scale(1.04);
    }

    .divider {
      width: 1px;
      height: 28px;
      background: var(--line);
      margin: 0 12px;
    }

    /* Komponen Sidebar */

    .side {
      background: var(--panel);
      border-radius: var(--r);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .side-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 8px 20px;
      font-weight: 700;
      color: var(--muted);
    }

    .side-head .add {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      transition: .2s;
    }

    .side-head .add:hover {
      background: var(--hover);
      color: var(--text);
    }

    .side-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .promo {
      background: var(--chip);
      border-radius: var(--r);
      padding: 20px;
    }

    .promo h4 {
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .promo p {
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .promo button {
      background: var(--accent);
      color: var(--on-accent);
      font-weight: 700;
      font-size: .85rem;
      padding: 8px 18px;
      border-radius: 999px;
      transition: .2s;
    }

    .promo button:hover {
      transform: scale(1.04);
    }

    /* Item navigasi (sidebar & tabs mobile) */

    .side-nav {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      color: var(--muted);
      font-weight: 700;
      font-size: .95rem;
      text-align: left;
      transition: .15s;
    }

    .nav-item i {
      width: 22px;
      text-align: center;
      font-size: 1.1rem;
    }

    .nav-item:hover {
      color: var(--text);
    }

    .nav-item.active {
      color: var(--accent-h);
      background: var(--soft);
    }


    .tabs {
      display: none;
      gap: 9px;
      overflow-x: auto;
      padding: 12px 0 4px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tabs .nav-item {
      width: auto;
      flex: none;
      padding: 8px 16px;
      gap: 8px;
      font-size: .85rem;
      background: var(--chip);
      border-radius: 999px;
    }

    .tabs .nav-item.active {
      background: var(--accent);
      color: var(--on-accent);
    }

    /* Area konten utama: section, grid, hero */

    .main {
      background: linear-gradient(180deg, var(--soft) 0, var(--panel) 280px);
      border-radius: var(--r);
      overflow-y: auto;
      padding: 8px 24px 32px;
      scroll-behavior: smooth;
    }

    .main::-webkit-scrollbar,
    .side-list::-webkit-scrollbar {
      width: 10px;
    }

    .main::-webkit-scrollbar-thumb,
    .side-list::-webkit-scrollbar-thumb {
      background: #c9467340;
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: content-box;
    }

    .section {
      margin-top: 24px;
    }

    .section h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -.01em;
    }


    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
    }

    .empty {
      color: var(--muted);
      padding: 40px 0;
      text-align: center;
      display: none;
    }

    .back {
      color: var(--muted);
      font-weight: 600;
      font-size: .85rem;
      margin-top: 16px;
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }

    .back:hover {
      color: var(--text);
    }

    .hero {
      display: flex;
      align-items: flex-end;
      gap: 24px;
      padding: 16px 0 8px;
    }

    .hero>img {
      width: clamp(110px, 18vw, 200px);
      aspect-ratio: 1;
      border-radius: 8px;
      object-fit: cover;
      flex: none;
      box-shadow: 0 8px 24px #b0376033;
    }

    .hero.round>img {
      border-radius: 50%;
    }


    .hero small {
      text-transform: uppercase;
      font-size: .72rem;
      font-weight: 700;
    }

    .hero h1 {
      font-size: clamp(1.6rem, 5vw, 3.4rem);
      line-height: 1.1;
      margin: 6px 0 8px;
    }

    .hero p {
      color: var(--muted);
      font-size: .9rem;
    }


    .sub {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 24px 0 12px;
    }

    .credit {
      margin-top: 40px;
      padding: 20px 0 4px;
      border-top: 1px solid var(--line);
      text-align: center;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
    }

    .credit-name {
      font-weight: 700;
      color: var(--accent-h);
    }

    .credit i {
      color: var(--accent);
      margin: 0 2px;
    }

    /* Komponen Card & Cover */

    .card {
      background: var(--card);
      border-radius: 8px;
      padding: 14px;
      position: relative;
      cursor: pointer;
      transition: background .25s;
      min-width: 0;
    }

    .card:hover,
    .card.playing {
      background: var(--card-h);
    }

    .cover {
      position: relative;
      aspect-ratio: 1;
      border-radius: 6px;
      overflow: hidden;
      background: var(--soft);
      box-shadow: 0 8px 24px #b0376033;
      margin-bottom: 14px;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-play {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--on-accent);
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      box-shadow: 0 8px 8px #b037604d;
      opacity: 0;
      transform: translateY(8px);
      transition: .25s;
    }

    .card:hover .card-play,
    .card.playing .card-play,
    .card-play:focus-visible {
      opacity: 1;
      transform: none;
    }

    .card-play:hover {
      background: var(--accent-h);
      transform: scale(1.06);
    }

    .card-title {
      font-weight: 700;
      font-size: .95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .card.playing .card-title {
      color: var(--accent);
    }

    .card-desc {
      font-size: .8rem;
      color: var(--muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card.round .cover {
      border-radius: 50%;
    }

    .card.round .card-title,
    .card.round .card-desc {
      text-align: center;
    }

    /* Komponen daftar lagu (track list) */

    .row {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) 56px;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--muted);
      font-size: .88rem;
    }

    .row.head {
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      cursor: default;
      font-size: .72rem;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .row:not(.head):hover {
      background: var(--hover);
    }

    .n {
      text-align: center;
    }

    .n i {
      display: none;
      color: var(--accent);
    }

    .row:hover .n b,
    .row.playing .n b {
      display: none;
    }

    .row:hover .n i,
    .row.playing .n i {
      display: inline;
    }

    .t {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .t img {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      flex: none;
      object-fit: cover;
    }

    .t>span {
      min-width: 0;
    }

    .t em {
      display: block;
      font-style: normal;
      color: var(--accent-h);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row.playing .t em {
      color: var(--accent);
    }

    .t small {
      display: block;
      font-size: .78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .c-t {
      text-align: right;
    }

    .nosrc {
      opacity: .5;
    }

    /* Komponen Player Bar */

    .player-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) minmax(0, 1fr);
      align-items: center;
      gap: 16px;
      padding: 0 12px;
      background: var(--panel);
    }

    .now {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .now img {
      width: 56px;
      height: 56px;
      border-radius: 6px;
      object-fit: cover;
      flex: none;
      background: var(--soft);
    }

    .now-text {
      min-width: 0;
    }

    .now-title {
      font-weight: 600;
      font-size: .9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now-desc {
      font-size: .75rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      max-width: 640px;
      width: 100%;
      justify-self: center;
    }

    .btns {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .ctl {
      color: var(--muted);
      font-size: 1rem;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      position: relative;
      transition: .15s;
    }

    .ctl:hover {
      color: var(--accent-h);
      transform: scale(1.08);
    }

    .ctl.active {
      color: var(--accent);
    }

    .ctl.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
    }

    #play {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--on-accent);
      font-size: 1rem;
    }

    #play:hover {
      transform: scale(1.07);
    }

    .seek {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .time {
      font-size: .72rem;
      color: var(--muted);
      min-width: 38px;
      font-variant-numeric: tabular-nums;
    }

    .time:first-child {
      text-align: right;
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 4px;
      outline: 0;
      cursor: pointer;
      flex: 1;
      min-width: 0;
      background: linear-gradient(to right, var(--accent-h) var(--p, 0%), var(--soft) var(--p, 0%));
    }

    input[type=range]:hover {
      background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--soft) var(--p, 0%));
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      transition: .15s;
    }

    input[type=range]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
    }

    input[type=range]:hover::-webkit-slider-thumb,
    input[type=range]:focus-visible::-webkit-slider-thumb {
      opacity: 1;
    }

    .extra {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      color: var(--muted);
    }

    .extra input {
      max-width: 110px;
    }

    .sc-credit {
      font-size: .7rem;
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
    }

    .sc-credit:hover {
      color: #ff5500;
    }

    /* Komponen Toast */

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--player-h) + 24px);
      transform: translateX(-50%) translateY(10px);
      background: var(--text);
      color: var(--on-accent);
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 600;
      font-size: .85rem;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 20;
      max-width: 90vw;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%);
    }

    /* Komponen Pagination & filter huruf artis */

    .pager-info {
      text-align: center;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 600;
      margin-top: 24px;
    }

    .pager {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin: 10px 0 8px;
    }

    .pager button,
    .letters button {
      min-width: 36px;
      height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--muted);
      font-weight: 700;
      font-size: .82rem;
      transition: .15s;
    }

    .pager button:hover:not(:disabled):not(.active),
    .letters button:hover:not(:disabled):not(.active) {
      background: var(--hover);
      color: var(--text);
    }

    .pager button.active {
      background: var(--accent);
      color: var(--on-accent);
    }

    .letters button.active {
      background: var(--accent);
      color: var(--on-accent);
    }

    .pager button:disabled,
    .letters button:disabled {
      opacity: .3;
      cursor: default;
    }

    .pager .gap {
      color: var(--muted);
      padding: 0 2px;
    }

    .letters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin: 28px 0 8px;
    }

    /* Media queries (tablet, mobile, layar besar, reduced motion) */

    @media (max-width:720px) {
      .tabs {
        display: flex;
      }

      .row {
        grid-template-columns: 28px minmax(0, 1fr) 44px;
        gap: 8px;
        padding: 8px 4px;
      }

      .hero {
        gap: 14px;
      }
    }

    @media (max-width:1100px) {
      :root {
        --side-w: 84px;
      }

      .nav-item {
        justify-content: center;
        padding: 14px 0;
      }

      .nav-item span {
        display: none;
      }

      .nav {
        grid-template-columns: auto minmax(0, 1fr) auto;
      }

      .nav-link,
      .divider {
        display: none;
      }

      .extra input {
        display: none;
      }
    }

    @media (max-width:720px) {
      :root {
        --nav-h: 56px;
        --player-h: 132px;
      }

      body {
        font-size: 15px;
      }

      .app {
        padding: 0;
        gap: 0;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: var(--nav-h) minmax(0, 1fr) var(--player-h);
        grid-template-areas: "nav" "main" "player";
        padding-top: env(safe-area-inset-top);
      }

      .side,
      .nav-right .nav-link,
      .nav-right .divider,
      .extra {
        display: none;
      }

      .nav {
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 10px;
        padding: 0 12px;
      }

      .logo {
        padding: 0;
      }

      .logo-icon {
        width: 36px;
        height: 36px;
        font-size: .9rem;
      }

      .logo-text {
        display: none;
      }

      .search {
        height: 40px;
        padding: 0 12px;
      }

      .main {
        border-radius: 0;
        padding: 4px 14px 20px;
      }

      .section {
        margin-top: 18px;
      }

      .section h2 {
        font-size: 1.2rem;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .card {
        padding: 10px;
      }

      .card-play {
        opacity: 1;
        transform: none;
        width: 40px;
        height: 40px;
      }

      .player-bar {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto;
        gap: 4px;

  <!-- Widget SoundCloud tersembunyi: mesin pemutar audio -->

    style="position:fixed;right:0;bottom:0;width:300px;height:166px;border:0;opacity:0;pointer-events:none;z-index:-1"
    src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A1768722903&auto_play=false"></iframe>
  <div class="toast" id="toast" role="status"></div>

  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script type="module">
    'use strict';

    /* ################ CONFIG       ################ */

    /* ---- config/constants.js ---- */
    /**
     * Konfigurasi aplikasi: satu-satunya tempat untuk teks, angka, dan daftar tetap.
     * Mengubah label menu, durasi timer, atau pesan toast cukup dilakukan di sini.
     */

    const NAV_ITEMS = Object.freeze([
      { view: 'home', label: 'Beranda', icon: 'fa-house' },
      { view: 'songs', label: 'Lagu', icon: 'fa-music' },
      { view: 'favorites', label: 'Favorit', icon: 'fa-heart' },
    ]);


    /** Jumlah lagu per section di halaman Home. */
    const HOME_RECOMMENDED_COUNT = 9;
    const HOME_RECENT_COUNT = 11;
    /** Satu-satunya artist di aplikasi ini. */
    const ARTIST_NAME = 'DJ Teloor';

    /** Halaman detail/pencarian dipetakan ke menu utama yang harus tampil aktif. */
    const SECTION_OF_VIEW = Object.freeze({
      search: 'songs',
    });

    const TIMING = Object.freeze({
      TOAST_MS: 2600,
      PLAY_NUDGE_MS: 1500,
      PLAY_WARNING_MS: 4000,
      PREFETCH_START_MS: 1500,
      PREFETCH_READY_MS: 6000,
      PREFETCH_TIMEOUT_MS: 10000,
      REFRESH_DEBOUNCE_MS: 400,
    });

    const MESSAGES = Object.freeze({
      NO_SOURCE: 'Link SoundCloud lagu ini belum diisi',
      NOT_STARTED: 'Lagu belum mulai, tekan tombol play sekali lagi',
      NO_PLAYER: 'Pemutar SoundCloud gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.',
      NOTHING_PLAYABLE: 'Tidak ada lagu yang bisa diputar',
      NO_RESULTS: 'Tidak ada lagu yang cocok.',
      NO_SONGS: 'Belum ada lagu. Lagu DJ Teloor akan muncul di sini.',
      NO_RECENT: 'Belum ada lagu yang diputar. Putar lagu mana pun, nanti muncul di sini.',
      NO_FAVORITES: 'Belum ada lagu favorit. Putar lagu, lalu tekan ikon love di bar pemutar untuk menyimpannya ke sini.',
    });

    const DEFAULT_VOLUME = 1;

    /** Huruf untuk pagination A-Z; item non-latin dikelompokkan ke "#" (lihat letterOf). */
    const ALPHABET = Object.freeze('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''));
    const LETTER_PAGES = Object.freeze([...ALPHABET, '#']);

    /* ---- config/events.js ---- */
    /** Nama event yang dipakai EventBus. Dipusatkan agar tidak ada string "ajaib" tersebar. */
    const Events = Object.freeze({
      ROUTE_CHANGE: 'route:change',
      PLAYER_RESET: 'player:reset',
      FAVORITES_CHANGE: 'favorites:change',
      PLAYER_STATE: 'player:state',
      PLAYER_TRACK: 'player:track',
      PLAYER_PROGRESS: 'player:progress',
      PLAYER_DURATION: 'player:duration',
      TOAST: 'toast:show',
    });

    /* ################ UTILS        ################ */

    /* ---- utils/array.js ---- */
    /** Helper struktur data & algoritma generik (tidak tahu apa pun tentang domain musik). */

    /** Perbandingan teks bahasa Indonesia, tidak peka huruf besar/kecil, angka dibaca sebagai angka. */
    const compareText = (a, b) =>
      String(a).localeCompare(String(b), 'id', { sensitivity: 'base', numeric: true });

    /**
     * Fisher-Yates shuffle, O(n), menghasilkan salinan baru (array asli tidak berubah).
     * Distribusi acak seragam, tidak seperti `sort(() => Math.random() - .5)`.
     */
    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /** Membangun Map key -> item untuk pencarian O(1). */
    function indexBy(items, keyOf) {
      const index = new Map();
      for (const item of items) index.set(keyOf(item), item);
      return index;
    }

    /** Mengelompokkan item per key dalam satu kali lintasan O(n); urutan asli tiap grup dipertahankan. */
    function groupBy(items, keyOf) {
      const groups = new Map();
      for (const item of items) {
        const key = keyOf(item);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(item);
      }
      return groups;
    }

    /* ---- utils/dom.js ---- */
    /** Helper kecil untuk DOM dan keamanan teks. */

    const byId = (id) => document.getElementById(id);

    const HTML_ENTITIES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

    /** Meloloskan teks dinamis sebelum disisipkan ke template HTML. */
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (c) => HTML_ENTITIES[c]);

    /** Menghapus karakter berbahaya dari input pengguna (dipakai pada judul hasil pencarian). */
    const stripHtmlChars = (value) => String(value).replace(/[<>&]/g, '');

    /** Mengisi bagian "terisi" dari input[type=range] lewat CSS variable --p. */
    const paintRange = (input, percent) => input.style.setProperty('--p', `${percent}%`);

    const e = escapeHtml; /* alias singkat untuk template HTML */

    /* ---- utils/format.js ---- */
    /** Fungsi murni untuk memformat angka menjadi teks tampilan. */

    /** 125 -> "2:05". Nilai tidak valid menghasilkan "0:00". */
    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return '0:00';
      const minutes = Math.floor(seconds / 60);
      const rest = String(Math.floor(seconds % 60)).padStart(2, '0');
      return `${minutes}:${rest}`;
    }

    /** Huruf pertama nama untuk filter A-Z; selain huruf latin dikelompokkan ke "#". */
    function letterOf(name) {
      const first = String(name).trim().charAt(0).toUpperCase();
      return /[A-Z]/.test(first) ? first : '#';
    }

    /** Gambar tanpa sumber valid (kosong / string "undefined") diganti placeholder abu-abu bertema musik. */
    const PLACEHOLDER_IMG = 'data:image/svg+xml,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#fbdde7"/>' +
      '<path d="M230 110v140a45 45 0 1 1-20-37V150l-70 18v110a45 45 0 1 1-20-37V135z" fill="#e9a9bd"/></svg>');
    /** Warna cover diambil dari data JSON (COLORS), dirujuk lewat colorId lagu. */
    const colorHex = (colorId) => COLORS.find((c) => c.id === colorId)?.hex;

    /** Placeholder berwarna (warna ditentukan oleh `colorId` dari data JSON). */
    const colorfulPlaceholder = (colorId) => {
      const color = colorHex(colorId) ?? '#e9a9bd';
      return 'data:image/svg+xml,' + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="${color}"/>` +
        '<path d="M230 110v140a45 45 0 1 1-20-37V150l-70 18v110a45 45 0 1 1-20-37V135z" fill="#ffffff" fill-opacity=".85"/></svg>');
    };

    const safeImg = (src, seed = null) => (!src || src === 'undefined' || src === 'null')
      ? (seed === null ? PLACEHOLDER_IMG : colorfulPlaceholder(seed))
      : src;

    /** Durasi lagu untuk tampilan; belum diketahui (0) tampil "--:--", bukan "0:00". */
    const formatDuration = (seconds) => (seconds > 0 ? formatTime(seconds) : '--:--');

    /** Ringkasan koleksi lagu, mis. "3 lagu · 10 mnt 05 dtk". */
    function formatTotal(songs) {
      const total = songs.reduce((sum, song) => sum + song.duration, 0);
      return `${songs.length} lagu · ${formatTime(total).replace(':', ' mnt ')} dtk`;
    }

    /* ################ DATA         ################ */

    /* ---- data/music-data.js ---- */
    /**
     * Data statis satu artist (DJ Teloor): artists, colors, songs.
     * Hanya data mentah, tanpa logika.
     */
    const MUSIC_DATA = {
      /* Satu artist saja. */
      artists: [
        {"id":1,"name":"DJ Teloor","bio":"DJ","img":"undefined"}
      ],
      /* Warna cover lagu (dipilih lewat colorId pada lagu). */
      colors: [
        {"id":1,"name":"Rose","hex":"#d9709a"},
        {"id":2,"name":"Blush","hex":"#eaa0b8"},
        {"id":3,"name":"Peach Pink","hex":"#f2a7a0"},
        {"id":4,"name":"Mauve","hex":"#b9789a"},
        {"id":5,"name":"Berry","hex":"#c2537f"},
        {"id":6,"name":"Lilac Pink","hex":"#cfa0c8"}
      ],
      /* Contoh: {"id":1,"name":"Judul Lagu","dur":210,"sc":"ID_TRACK_SOUNDCLOUD","colorId":1}  (dur = detik, colorId opsional). Urutan di sini = urutan tampil. */
      songs: [
        {"id":1,"name":"Falls","dur":278,"sc":"2299394519","colorId":1},
        {"id":2,"name":"BREAKBEAT BAILAR _ CANT STOP LOVING YOU _ REMIX DJ TELOOR","dur":262,"sc":"2330057225","colorId":2},
        {"id":3,"name":"Black Hole","dur":364,"sc":"2354005988","colorId":3},
        {"id":4,"name":"Aftershock","dur":281,"sc":"2329440296","colorId":4},
        {"id":5,"name":"CONCRETE_ANGEL_DJ_TELOOR","dur":379,"sc":"2250433652","colorId":5},
        {"id":6,"name":"Alive (Remix)","dur":440,"sc":"2295308027","colorId":6},
        {"id":7,"name":"Paradise","dur":388,"sc":"2297297129","colorId":1},
        {"id":8,"name":"Beautiful Lie X Do Bad Well","dur":299,"sc":"2335294559","colorId":2},
        {"id":9,"name":"BERDUA LEBIH BAIK BREAKBEAT STADIUM BY DJ TELOOR","dur":350,"sc":"2128346226","colorId":3},
        {"id":10,"name":"BREAKBEAT 2025 SHADOW ONEONEONE SUASANA CLUB STADIUM DJ TELOOR","dur":384,"sc":"2038772636","colorId":4},
        {"id":11,"name":"WET GUITAR","dur":487,"sc":"2041383785","colorId":5},
        {"id":12,"name":"DJ TELOOR MIXTAPE CHAPTER 3","dur":3958,"sc":"2331796112","colorId":6}
      ]
    };

    /** Warna cover lagu (dipakai colorfulPlaceholder). */
    let COLORS = MUSIC_DATA.colors;

    /* ################ MODELS       ################ */

    /* ---- models/Artist.js ---- */
    class Artist {
      constructor({ id, name, bio, img }) {
        this.id = id;
        this.name = name;
        this.bio = bio;
        this.img = safeImg(img);
        /** Diisi oleh MusicLibrary saat relasi dibangun. */
        this.songs = [];
      }
    }

    /* ---- models/Song.js ---- */
    class Song {
      constructor({ id, name, dur, sc, colorId = 1 }) {
        this.id = id;
        this.name = name;
        this.colorId = colorId;
        /** Durasi dalam detik; diperbarui dengan durasi asli dari SoundCloud saat lagu diputar. */
        this.duration = dur;
        /** ID track SoundCloud. null = belum bisa diputar. */
        this.soundCloudId = sc;
        /** Diisi oleh MusicLibrary. */
        this.artist = null;
        this.searchText = '';
      }

      /** Cover berwarna sesuai colorId lagu. */
      get cover() {
        return colorfulPlaceholder(this.colorId);
      }

      get isPlayable() {
        return Boolean(this.soundCloudId);
      }

      /** Menyiapkan teks pencarian sekali saja. */
      buildSearchText() {
        this.searchText = String(this.name).toLowerCase();
      }

      matches(query) {
        return this.searchText.includes(query);
      }
    }

    /* ################ CORE         ################ */

    /* ---- core/EventBus.js ---- */
    /** Pola Observer: komponen dan service saling berkomunikasi tanpa saling mengenal. */
    class EventBus {
      #listeners = new Map();

      /** Mendaftarkan handler. Mengembalikan fungsi untuk berhenti berlangganan. */
      on(event, handler) {
        if (!this.#listeners.has(event)) this.#listeners.set(event, new Set());
        this.#listeners.get(event).add(handler);
        return () => this.off(event, handler);
      }

      off(event, handler) {
        this.#listeners.get(event)?.delete(handler);
      }

      emit(event, payload) {
        this.#listeners.get(event)?.forEach((handler) => handler(payload));
      }
    }

    /* ---- core/Component.js ---- */
    /**
     * Kelas dasar komponen UI.
     *
     * Siklus hidup:  constructor(root) -> mount() -> [render() -> bind()] -> unmount()
     *  - render(): mengembalikan markup HTML (string). Kembalikan null jika markup sudah ada di halaman.
     *  - bind():   menautkan event DOM dan langganan EventBus. Gunakan listen()/subscribe()
     *              agar semuanya otomatis dibersihkan saat unmount().
     */
    class Component {
      #cleanups = [];

      constructor(root) {
        if (!root) throw new Error(`${this.constructor.name}: elemen root tidak ditemukan`);
        this.root = root;
      }

      render() {
        return null;
      }

      bind() {}

      mount() {
        const markup = this.render();
        if (markup !== null) this.root.innerHTML = markup;
        this.bind();
        return this;
      }

      unmount() {
        this.#cleanups.forEach((cleanup) => cleanup());
        this.#cleanups = [];
      }

      /** Mencari elemen di dalam root komponen. */
      $(selector) {
        return this.root.querySelector(selector);
      }

      $$(selector) {
        return this.root.querySelectorAll(selector);
      }

      listen(target, type, handler, options) {
        target.addEventListener(type, handler, options);
        this.#cleanups.push(() => target.removeEventListener(type, handler, options));
      }

      subscribe(bus, event, handler) {
        this.#cleanups.push(bus.on(event, handler));
      }
    }

    /* ---- core/Router.js ---- */
    /** Value object: halaman mana yang sedang ditampilkan. Token berbentuk "view" atau "view:id". */
    class Route {
      constructor(view, id = null, query = '', page = 1, letter = '') {
        this.view = view;
        this.id = id;
        this.query = query;
        /** Nomor halaman pagination (mulai dari 1). */
        this.page = page;
        /** Filter huruf artis ('' = semua). */
        this.letter = letter;
      }

      static parse(token) {
        const [view, id] = token.split(':');
        return new Route(view, id ? Number(id) : null);
      }

      static search(query) {
        return new Route('search', null, query);
      }

      /** Halaman utama (daftar) yang valid, dan halaman detail yang wajib punya ID. */
      static #LISTS = new Set(NAV_ITEMS.map((item) => item.view));
      static #DETAILS = new Set();

      /**
       * URL hash -> Route. Bentuk: #/home, #/artists?huruf=A, #/artist/5, #/search/kata.
       * Hash tidak dikenal / rusak menghasilkan null (pemanggil memilih halaman cadangan).
       */
      static fromHash(hash) {
        try {
          const raw = String(hash ?? '').replace(/^#\/?/, '');
          if (!raw) return null;
          const [path, qs = ''] = raw.split('?');
          const [view, ...rest] = path.split('/');
          if (view === 'search') {
            const query = decodeURIComponent(rest.join('/')).trim();
            return query ? Route.search(query) : null;
          }
          if (Route.#DETAILS.has(view)) {
            const id = Number(rest[0]);
            return Number.isInteger(id) && id > 0 ? new Route(view, id) : null;
          }
          if (Route.#LISTS.has(view)) {
            const letter = (new URLSearchParams(qs).get('huruf') || '').toUpperCase();
            return new Route(view, null, '', 1, /^([A-Z]|#)$/.test(letter) ? letter : '');
          }
        } catch { /* hash rusak: abaikan */ }
        return null;
      }

      /** Route -> URL hash (kebalikan dari fromHash). */
      toHash() {
        if (this.view === 'search') return `#/search/${encodeURIComponent(this.query)}`;
        if (this.id !== null) return `#/${this.view}/${this.id}`;
        return `#/${this.view}${this.letter ? `?huruf=${encodeURIComponent(this.letter)}` : ''}`;
      }

      /** Halaman daftar tingkat atas (punya filter huruf), bukan detail atau pencarian. */
      get isList() {
        return this.id === null && this.view !== 'search';
      }

      /** Menu utama yang harus tampil aktif untuk halaman ini. */
      get section() {
        return SECTION_OF_VIEW[this.view] ?? this.view;
      }
    }

    /**
     * Router berbasis URL hash (#/songs, #/artist/5, #/search/kata) sehingga bekerja juga saat file dibuka
     * langsung (file://). Tombol back/forward browser, refresh, dan link yang dibagikan membuka halaman yang sama.
     * Halaman terakhir (selain pencarian) diingat di localStorage untuk kunjungan tanpa hash.
     * Mengingat halaman terakhir yang dibuka lewat navigasi supaya mengosongkan kolom pencarian
     * bisa kembali ke halaman tersebut.
     */
    class Router {
      #current = new Route('home');
      #lastPage = this.#current;
      #hash = '';
      /** Kata pencarian aktif; bertahan saat pindah halaman sampai pengguna menghapusnya. */
      #query = '';
      /** Huruf pagination terakhir per halaman daftar, mis. { artists: 'G' }; dipulihkan saat halaman dibuka lagi. */
      #letters = {};
      /** Halaman detail terakhir per menu, mis. { artists: 'artist:2' }; dipulihkan saat menu itu dibuka lagi dari navigasi. */
      #details = {};

      constructor(bus) {
        this.bus = bus;
        window.addEventListener('popstate', () => this.#onPopState());
      }

      get current() {
        return this.#current;
      }

      get query() {
        return this.#query;
      }

      #hashOf(route) {
        const hash = route.toHash();
        return hash;
      }

      /**
       * @param {string} token  "view" atau "view:id"
       * @param {{restore?: boolean}} [options]  restore=true (klik menu utama): bila menu itu punya detail
       *        yang terakhir dibuka (mis. artist Avenged Sevenfold), buka lagi detail tersebut, bukan daftarnya.
       */
      navigate(token, { restore = false } = {}) {
        let target = Route.parse(token);
        if (target.isList) {
          const saved = restore ? this.#details[target.view] : null;
          /* Tombol "kembali" ke daftar (restore=false) menghapus ingatan detail. */
          if (saved) target = Route.parse(saved);
          else {
            delete this.#details[target.view];
            AppStorage.update({ details: this.#details });
            target = this.#withSavedLetter(target);
          }
        }
        this.#rememberDetail(target);
        this.#lastPage = target;
        /* Kembali ke Songs saat masih ada kata pencarian: tampilkan lagi hasil pencariannya. */
        this.#current = target.view === 'songs' && this.#query ? Route.search(this.#query) : target;
        this.#writeUrl(false);
        this.bus.emit(Events.ROUTE_CHANGE, { route: this.#current, source: 'navigate' });
      }

      /** Query kosong = kembali ke halaman terakhir. */
      search(query) {
        const wasSearch = this.#current.view === 'search';
        this.#query = query;
        AppStorage.update({ query });
        /* Kolom dikosongkan saat berada di halaman lain (bukan hasil pencarian): halaman tidak perlu dimuat ulang. */
        if (!query && !wasSearch) return;
        this.#current = query ? Route.search(query) : this.#lastPage;
        /* Mengetik terus tidak menambah riwayat: entri pencarian diganti, bukan ditumpuk. */
        this.#writeUrl(wasSearch);
        this.bus.emit(Events.ROUTE_CHANGE, { route: this.#current, source: 'search' });
      }

      /** Pindah ke halaman huruf (A, B, C, ...) pada tampilan daftar yang sedang dibuka. */
      setLetter(letter) {
        const r = this.#current;
        this.#current = new Route(r.view, r.id, r.query, 1, letter);
        this.#lastPage = this.#current;
        this.#rememberLetter(r.view, letter);
        this.#writeUrl(false);
        this.bus.emit(Events.ROUTE_CHANGE, { route: this.#current, source: 'page' });
      }

      /** Memicu render awal: dari URL, lalu halaman terakhir di localStorage, lalu Home. */
      start() {
        this.#enter(Route.fromHash(location.hash), 'start', true);
      }

      /** Memuat status tersimpan milik halaman aktif (huruf & detail terakhir), menyiapkan route, lalu menampilkannya. */
      #enter(hashRoute, source, replace) {
        const saved = AppStorage.read();
        this.#loadSaved(saved);
        let route = this.#withSavedLetter(hashRoute
          ?? Route.fromHash(saved.route)
          ?? new Route('home'));
        if (route.isList) this.#rememberLetter(route.view, route.letter);
        this.#rememberDetail(route);
        this.#query = route.view === 'search' ? route.query : (typeof saved.query === 'string' ? saved.query : '');
        this.#lastPage = route.view === 'search' ? new Route('home') : route;
        if (route.view === 'songs' && this.#query) route = Route.search(this.#query);
        this.#current = route;
        AppStorage.update({ query: this.#query });
        this.#writeUrl(replace);
        this.bus.emit(Events.ROUTE_CHANGE, { route: this.#current, source });
      }

      #loadSaved(saved) {
        this.#letters = {};
        this.#details = {};
        if (saved.letters && typeof saved.letters === 'object') {
          for (const [view, letter] of Object.entries(saved.letters)) {
            if (/^([A-Z]|#)$/.test(letter)) this.#letters[view] = letter;
          }
        }
        if (saved.details && typeof saved.details === 'object') {
          for (const [view, token] of Object.entries(saved.details)) {
            const r = typeof token === 'string' ? Route.parse(token) : null;
            if (r && r.id > 0 && Number.isInteger(r.id) && r.section === view) this.#details[view] = token;
          }
        }
      }

      #rememberLetter(view, letter) {
        if (view === 'search') return;
        if (letter) this.#letters[view] = letter;
        else delete this.#letters[view];
        AppStorage.update({ letters: this.#letters });
      }

      /** Mengingat detail yang sedang dibuka untuk menu induknya. */
      #rememberDetail(route) {
        if (route.id === null || route.view === 'search') return;
        this.#details[route.section] = `${route.view}:${route.id}`;
        AppStorage.update({ details: this.#details });
      }

      /** Halaman daftar tanpa huruf dibuka lagi: pakai huruf terakhir yang dipilih di halaman itu. */
      #withSavedLetter(route) {
        const letter = this.#letters[route.view];
        return route.isList && !route.letter && letter ? new Route(route.view, null, '', 1, letter) : route;
      }

      /** Back/forward browser atau hash diubah manual di address bar . */
      #onPopState() {
        const hash = location.hash;
        if (hash === this.#hash) return;
        let hashRoute = Route.fromHash(hash);
        let route = hashRoute ?? new Route('home');
        if (route.isList) this.#rememberLetter(route.view, route.letter);
        this.#rememberDetail(route);
        if (route.view === 'search') this.#query = route.query;
        else {
          this.#lastPage = route;
          if (route.view === 'songs' && this.#query) route = Route.search(this.#query);
        }
        this.#current = route;
        AppStorage.update({ query: this.#query });
        this.#hash = this.#hashOf(route);
        AppStorage.update({ route: this.#lastPage.toHash() });
        this.bus.emit(Events.ROUTE_CHANGE, { route, source: 'popstate' });
      }

      #writeUrl(replace) {
        const hash = this.#hashOf(this.#current);
        AppStorage.update({ route: this.#lastPage.toHash() });
        if (hash === this.#hash && !replace) return;
        this.#hash = hash;
        try {
          history[replace ? 'replaceState' : 'pushState'](null, '', hash);
        } catch {
          location.hash = hash; /* cadangan bila History API ditolak */
        }
      }
    }

    /* ---- services/MusicLibrary.js ---- */
    /** Repository katalog musik: satu artist dan semua lagunya, dengan pencarian lagu per id (O(1)). */
    class MusicLibrary {
      #artistById;
      #songById;

      constructor({ artists, songs }) {
        this.artists = artists.map((row) => new Artist(row));
        this.songs = songs.map((row) => new Song(row));
        this.#artistById = indexBy(this.artists, (a) => a.id);
        this.#songById = indexBy(this.songs, (s) => s.id);

        /* Hanya ada satu artist: semua lagu miliknya. */
        const artist = this.artists[0];
        for (const song of this.songs) {
          song.artist = artist;
          artist.songs.push(song);
          song.buildSearchText();
        }
      }

      getSong(id) { return this.#songById.get(id); }
      getArtist(id) { return this.#artistById.get(id); }

      /** Semua lagu DJ Teloor, sesuai urutan di data. */
      sortedSongs() { return this.songs; }
    }

    /* ---- services/SearchService.js ---- */
    /**
     * Pencarian lagu berdasarkan judul lagu.
     * Teks pencarian setiap lagu sudah dihitung sekali (Song.searchText),
     * sehingga tiap ketikan hanya satu lintasan O(n) tanpa membangun string ulang.
     */
    class SearchService {
      constructor(library) {
        this.library = library;
      }

      /** @param {string} rawQuery teks mentah dari input */
      search(rawQuery) {
        const query = rawQuery.trim().toLowerCase();
        if (!query) return [];
        return this.library.songs.filter((song) => song.matches(query));
      }
    }

    /* ---- services/FavoritesStore.js ---- */
    /**
     * Daftar lagu favorit, disimpan di localStorage (kunci sendiri).
     * Identitas lagu = ID lagu, sehingga tidak ada duplikasi.
     * Menyimpan hanya kuncinya; objek lagu dicari lewat register() dari pustaka.
     */
    class FavoritesStore {
      static KEY = 'musik-teloor-favorit-v1';

      #keys;
      #keyOf = new WeakMap();
      #songByKey = new Map();

      constructor({ bus }) {
        this.bus = bus;
        this.#keys = this.#read();
      }

      /** Mendaftarkan semua lagu agar bisa dicari lewat kuncinya. */
      register(library) {
        for (const song of library.songs) {
          this.#keyOf.set(song, song.id);
          this.#songByKey.set(song.id, song);
        }
      }

      keyOf(song) {
        return this.#keyOf.get(song) ?? song.id;
      }

      has(song) {
        return Boolean(song) && this.#keys.includes(this.keyOf(song));
      }

      /** Menambah atau menghapus lagu dari Favorites. Mengembalikan true bila kini menjadi favorit. */
      toggle(song) {
        const key = this.keyOf(song);
        const favorite = !this.#keys.includes(key);
        this.#keys = favorite ? [...this.#keys, key] : this.#keys.filter((k) => k !== key);
        this.#write();
        this.bus.emit(Events.FAVORITES_CHANGE, { song, favorite });
        return favorite;
      }

      /** Lagu favorit dari semua halaman, yang terbaru ditambahkan di paling atas. */
      get songs() {
        return [...this.#keys].reverse().map((key) => this.#songByKey.get(key)).filter(Boolean);
      }

      #read() {
        try {
          const value = JSON.parse(localStorage.getItem(FavoritesStore.KEY));
          return Array.isArray(value)
            ? [...new Set(value.filter((k) => typeof k === 'number' || typeof k === 'string'))]
            : [];
        } catch { return []; }
      }

      #write() {
        try { localStorage.setItem(FavoritesStore.KEY, JSON.stringify(this.#keys)); } catch { /* abaikan */ }
      }
    }

    /* ---- services/PlayQueue.js ---- */
    /**
     * Antrean putar.
     *
     *  - #source   : daftar asal (urutan tampilan di halaman)
     *  - #order    : urutan putar aktual (sama dengan source, atau hasil Fisher-Yates jika shuffle)
     *  - #cursor   : indeks lagu yang sedang aktif di #order
     *  - #position : Map<songId, indeks> untuk mencari posisi lagu O(1)
     *
     * Navigasi next/previous bersifat melingkar (circular buffer) dan melewati lagu yang belum
     * punya sumber SoundCloud.
     */
    class PlayQueue {
      #source = [];
      #order = [];
      #position = new Map();
      #cursor = 0;
      #shuffled = false;

      constructor(songs) {
        this.load(songs);
      }

      get current() {
        return this.#order[this.#cursor];
      }

      get cursor() {
        return this.#cursor;
      }

      get size() {
        return this.#order.length;
      }

      get isShuffled() {
        return this.#shuffled;
      }

      /** Mengganti antrean dengan `songs`. Jika startId diberikan, kursor diarahkan ke lagu itu. */
      load(songs, startId = null) {
        this.#source = songs;
        this.#rebuildOrder();
        if (startId !== null) this.#cursor = this.indexOf(startId);
        return this;
      }

      setShuffle(enabled) {
        const currentId = this.current?.id;
        this.#shuffled = enabled;
        this.#rebuildOrder();
        if (currentId !== undefined) this.#cursor = this.indexOf(currentId);
      }

      indexOf(songId) {
        return this.#position.get(songId) ?? -1;
      }

      isCurrent(songId) {
        return this.current?.id === songId;
      }

      jumpTo(index) {
        this.#cursor = index;
        return this.current;
      }

      /**
       * Indeks lagu berikutnya (direction = 1) atau sebelumnya (-1) yang bisa diputar,
       * dengan wrap-around. Mengembalikan -1 bila tidak ada satu pun yang bisa diputar.
       */
      findPlayable(direction) {
        const n = this.#order.length;
        for (let step = 1; step <= n; step++) {
          const index = (((this.#cursor + direction * step) % n) + n) % n;
          if (this.#order[index].isPlayable) return index;
        }
        return -1;
      }

      #rebuildOrder() {
        this.#order = this.#shuffled ? shuffle(this.#source) : [...this.#source];
        this.#position = new Map(this.#order.map((song, index) => [song.id, index]));
        this.#cursor = Math.min(this.#cursor, Math.max(this.#order.length - 1, 0));
      }
    }

    /* ---- services/SoundCloudPlayer.js ---- */
    /**
     * Adapter untuk SoundCloud Widget API (satu-satunya sumber audio aplikasi).
     * Seluruh pengetahuan tentang `SC.Widget` dikurung di kelas ini; bagian lain aplikasi
     * hanya berbicara lewat method sederhana (play, pause, load, ...).
     */
    class SoundCloudPlayer {
      #widget;
      #events;

      /**
       * @param {HTMLIFrameElement} iframe iframe tersembunyi berisi widget SoundCloud
       * @param {object} sc objek global `SC` dari https://w.soundcloud.com/player/api.js
       */
      constructor(iframe, sc = window.SC) {
        /* API gagal dimuat (offline/diblokir): aplikasi tetap tampil, pemutaran dinonaktifkan. */
        this.available = Boolean(sc);
        if (sc) {
          this.#widget = sc.Widget(iframe);
          this.#events = sc.Widget.Events;
        } else {
          this.#widget = {
            load() {}, play() {}, pause() {}, seekTo() {}, setVolume() {}, bind() {},
            getDuration: (cb) => cb(0), getCurrentSound: (cb) => cb(null),
          };
          this.#events = {};
        }
      }

      /** Track biasa diberi ID angka; ID berawalan "p" menandakan playlist SoundCloud. */
      static urlFor(id) {
        const value = String(id);
        return value.startsWith('p')
          ? `https://api.soundcloud.com/playlists/soundcloud%3Aplaylists%3A${value.slice(1)}`
          : `https://api.soundcloud.com/tracks/soundcloud%3Atracks%3A${value}`;
      }

      load(id, onReady, autoPlay = true) {
        this.#widget.load(SoundCloudPlayer.urlFor(id), {
          auto_play: autoPlay,
          show_teaser: false,
          callback: onReady,
        });
      }

      play() { this.#widget.play(); }
      pause() { this.#widget.pause(); }
      seekTo(milliseconds) { this.#widget.seekTo(milliseconds); }

      /** @param {number} fraction 0..1 */
      setVolume(fraction) { this.#widget.setVolume(fraction * 100); }

      /** @returns {Promise<number>} durasi track dalam milidetik */
      getDuration() {
        return new Promise((resolve) => this.#widget.getDuration(resolve));
      }

      onReady(handler) { this.#widget.bind(this.#events.READY, handler); }

      /** @returns {Promise<object|null>} data track yang sedang dimuat widget (id, duration dalam ms, ...) */
      getCurrentSound() {
        return new Promise((resolve) => this.#widget.getCurrentSound((sound) => resolve(sound)));
      }

      onPlay(handler) { this.#widget.bind(this.#events.PLAY, handler); }
      onPause(handler) { this.#widget.bind(this.#events.PAUSE, handler); }
      onFinish(handler) { this.#widget.bind(this.#events.FINISH, handler); }

      /** handler menerima { percent: 0..100, seconds } */
      onProgress(handler) {
        this.#widget.bind(this.#events.PLAY_PROGRESS, (e) =>
          handler({ percent: e.relativePosition * 100, seconds: e.currentPosition / 1000 }));
      }
    }

    /* ---- services/PlayerController.js ---- */
    /**
     * Pengendali pemutaran: menggabungkan PlayQueue (apa yang diputar) dengan SoundCloudPlayer
     * (bagaimana diputar), lalu mengabarkan perubahan lewat EventBus.
     * Kelas ini tidak menyentuh DOM sama sekali.
     */
    class PlayerController {
      #started = false;
      #playing = false;
      #repeat = false;
      #volume = DEFAULT_VOLUME;
      #loadedSongId = null;
      /** Asal antrean aktif: 'favorites' bila diputar dari halaman Favorites, selain itu null. */
      #queueTag = null;
      #nudgeTimer = null;
      #warningTimer = null;

      /**
       * @param {object} deps
       * @param {import('./SoundCloudPlayer.js').SoundCloudPlayer} deps.soundCloud
       * @param {import('../core/EventBus.js').EventBus} deps.bus
       * @param {import('../models/Song.js').Song[]} deps.songs antrean awal
       */
      constructor({ soundCloud, bus, songs }) {
        this.sc = soundCloud;
        this.bus = bus;
        this.queue = new PlayQueue(songs);
        this.#restoreSaved();
        this.#listenToSoundCloud();
      }

      /** Memulihkan volume, shuffle/repeat, dan lagu terakhir dari localStorage (belum diputar otomatis). */
      #restoreSaved() {
        const saved = AppStorage.read();
        if (typeof saved.volume === 'number' && saved.volume >= 0 && saved.volume <= 1) this.#volume = saved.volume;
        if (saved.shuffle === true) this.queue.setShuffle(true);
        else if (saved.repeat === true) this.#repeat = true;
        const index = this.queue.indexOf(saved.songId);
        if (index !== -1) this.queue.jumpTo(index);
      }

      #persist() {
        AppStorage.update({
          volume: this.#volume,
          songId: this.queue.current?.id,
          shuffle: this.queue.isShuffled,
          repeat: this.#repeat,
        });
      }

      get currentSong() { return this.queue.current; }
      get volume() { return this.#volume; }

      /** True jika lagu ini sudah dimulai dan sedang menjadi lagu aktif. */
      isCurrent(songId) {
        return this.#started && this.queue.isCurrent(songId);
      }

      get state() {
        return {
          activeId: this.#started && this.queue.current ? this.queue.current.id : null,
          playing: this.#playing,
          shuffle: this.queue.isShuffled,
          repeat: this.#repeat,
        };
      }

      /* ---------- Perintah dari UI ---------- */

      playFrom(songs, songId, tag = null) {
        this.#queueTag = tag;
        this.queue.load(songs, songId);
        this.#playAt(this.queue.indexOf(songId));
      }

      /**
       * Jika antrean berasal dari Favorites, ikuti perubahan daftar favorit (tambah/hapus) tanpa menghentikan lagu.
       * Lagu yang sedang diputar tetap ada di antrean walau baru dihapus dari favorit.
       */
      syncFavoritesQueue(favoriteSongs) {
        if (this.#queueTag !== 'favorites') return;
        const current = this.queue.current;
        const list = current && !favoriteSongs.includes(current) ? [current, ...favoriteSongs] : favoriteSongs;
        this.queue.load(list, current ? current.id : null);
        this.#persist();
      }

      toggle() {
        const song = this.queue.current;
        if (!song) return this.#toast(MESSAGES.NOTHING_PLAYABLE);
        this.#started = true;
        if (!song.isPlayable) {
          this.#emitState();
          return this.#toast(MESSAGES.NO_SOURCE);
        }
        // Lagu yang tampil di player belum pernah dimuat -> muat dulu, jangan hanya menekan play.
        if (this.#loadedSongId !== song.id) return this.#playAt(this.queue.cursor);
        if (this.#playing) {
          /* Jeda manual: batalkan percobaan "dorong play" otomatis agar lagu tidak menyala lagi sendiri. */
          clearTimeout(this.#nudgeTimer);
          clearTimeout(this.#warningTimer);
          this.sc.pause();
        } else this.sc.play();
      }

      /** direction: 1 = berikutnya, -1 = sebelumnya. Repeat hanya berlaku saat maju. */
      step(direction) {
        if (this.#repeat && direction > 0) {
          const song = this.queue.current;
          /* Lagu aktif belum pernah dimuat (mis. baru dipulihkan): muat dulu, jangan memutar trek bawaan widget. */
          if (!song || this.#loadedSongId !== song.id) return this.#playAt(this.queue.cursor);
          this.sc.seekTo(0);
          this.sc.play();
          return;
        }
        const index = this.queue.findPlayable(direction);
        if (index === -1) return this.#toast(MESSAGES.NOTHING_PLAYABLE);
        this.#playAt(index);
      }

      toggleShuffle() {
        this.queue.setShuffle(!this.queue.isShuffled);
        if (this.queue.isShuffled) this.#repeat = false;
        this.#persist();
        this.#emitState();
      }

      toggleRepeat() {
        this.#repeat = !this.#repeat;
        if (this.#repeat) this.queue.setShuffle(false);
        this.#persist();
        this.#emitState();
      }

      async seekToPercent(percent) {
        if (this.#loadedSongId === null || this.#loadedSongId !== this.queue.current?.id) return;
        const duration = await this.sc.getDuration();
        this.sc.seekTo((percent / 100) * duration);
      }

      setVolume(fraction) {
        this.#volume = fraction;
        this.sc.setVolume(fraction);
        this.#persist();
      }

      /* ---------- Internal ---------- */

      #playAt(index) {
        const song = this.queue.jumpTo(index);
        this.#started = true;
        this.#persist();
        this.bus.emit(Events.PLAYER_TRACK, song);
        this.bus.emit(Events.PLAYER_PROGRESS, { percent: 0, seconds: 0 });

        if (!song.isPlayable) {
          this.#playing = false;
          this.sc.pause();
          this.#emitState();
          return this.#toast(MESSAGES.NO_SOURCE);
        }

        if (!this.sc.available) {
          this.#playing = false;
          this.#emitState();
          return this.#toast(MESSAGES.NO_PLAYER);
        }

        this.#playing = true;
        this.#loadedSongId = song.id;
        this.#emitState();
        this.sc.load(song.soundCloudId, () => {
          this.sc.setVolume(this.#volume);
          this.sc.play();
        });
        this.#watchStart(song);
      }

      /** Beberapa browser menolak autoplay: coba sekali lagi, lalu beri petunjuk ke pengguna. */
      #watchStart(song) {
        const stalled = () => this.queue.current === song && !this.#playing;
        clearTimeout(this.#nudgeTimer);
        this.#nudgeTimer = setTimeout(() => stalled() && this.sc.play(), TIMING.PLAY_NUDGE_MS);
        clearTimeout(this.#warningTimer);
        this.#warningTimer = setTimeout(() => {
          if (!stalled()) return;
          this.#emitState();
          this.#toast(MESSAGES.NOT_STARTED);
        }, TIMING.PLAY_WARNING_MS);
      }

      #listenToSoundCloud() {
        this.sc.onPlay(() => {
          this.#playing = true;
          this.#emitState();
          this.sc.setVolume(this.#volume);
          this.#syncDuration();
        });
        this.sc.onPause(() => {
          this.#playing = false;
          this.#emitState();
        });
        this.sc.onFinish(() => {
          this.#playing = false;
          this.step(1);
        });
        this.sc.onProgress((progress) => this.bus.emit(Events.PLAYER_PROGRESS, progress));
      }

      /**
       * Memperbarui durasi lagu aktif dengan durasi asli dari SoundCloud.
       * Data track diverifikasi (id harus cocok) agar event dari lagu sebelumnya tidak menimpa durasi lagu baru.
       */
      async #syncDuration() {
        const song = this.queue.current;
        const sound = await this.sc.getCurrentSound();
        if (!sound || !song || this.queue.current !== song) return;
        const isPlaylist = String(song.soundCloudId).startsWith('p');
        if (!isPlaylist && sound.id !== undefined && String(sound.id) !== String(song.soundCloudId)) return;
        if (!(sound.duration > 0)) return;
        song.duration = sound.duration / 1000;
        DurationCache.save(song.soundCloudId, song.duration);
        this.bus.emit(Events.PLAYER_DURATION, { song, seconds: song.duration });
      }

      #emitState() {
        this.bus.emit(Events.PLAYER_STATE, this.state);
      }

      #toast(message) {
        this.bus.emit(Events.TOAST, message);
      }
    }

    /* ---- services/AppStorage.js ---- */
    /**
     * Pengaturan pengguna di localStorage: halaman terakhir, volume, lagu terakhir, shuffle, repeat.
     * Volume, shuffle, dan repeat juga disimpan di sini.
     */
    const AppStorage = {
      KEY: 'musik-teloor-pengaturan-v1',
      read() {
        try {
          const value = JSON.parse(localStorage.getItem(this.KEY));
          return value && typeof value === 'object' ? value : {};
        } catch { return {}; }
      },
      update(patch) {
        try { localStorage.setItem(this.KEY, JSON.stringify({ ...this.read(), ...patch })); } catch { /* storage tidak tersedia: abaikan */ }
      },
    };

    /* ---- services/DurationCache.js ---- */
    /** Menyimpan durasi asli dari SoundCloud di browser (localStorage), per ID track SoundCloud, supaya kunjungan berikutnya langsung tepat. */
    const DurationCache = {
      KEY: 'musik-durasi-soundcloud-v4',
      read() {
        try { return JSON.parse(localStorage.getItem(this.KEY)) || {}; } catch { return {}; }
      },
      save(soundCloudId, seconds) {
        try {
          const all = this.read();
          all[soundCloudId] = seconds;
          localStorage.setItem(this.KEY, JSON.stringify(all));
        } catch { /* storage tidak tersedia: abaikan */ }
      },
      apply(songs) {
        const all = this.read();
        songs.forEach((song) => { if (all[song.soundCloudId] > 0) song.duration = all[song.soundCloudId]; });
      },
    };

    /* ---- services/RecentlyPlayed.js ---- */
    /**
     * Riwayat lagu yang terakhir diputar (terbaru di depan, tanpa duplikat, maksimal HOME_RECENT_COUNT).
     * Disimpan di localStorage agar tetap ada setelah refresh.
     */
    class RecentlyPlayed {
      static KEY = 'musik-teloor-terakhir-diputar-v1';

      #library;
      #ids;
      #key;

      constructor({ library, bus }) {
        this.#library = library;
        this.#key = RecentlyPlayed.KEY;
        this.#ids = this.#read();
        bus.on(Events.PLAYER_TRACK, (song) => this.add(song));
      }

      /** Lagu yang bisa diputar dan terdaftar di pustaka dimasukkan ke posisi paling depan. */
      add(song) {
        if (!song || !song.isPlayable || this.#library.getSong(song.id) !== song) return;
        this.#ids = [song.id, ...this.#ids.filter((id) => id !== song.id)].slice(0, HOME_RECENT_COUNT);
        try { localStorage.setItem(this.#key, JSON.stringify(this.#ids)); } catch { /* storage tidak tersedia: abaikan */ }
      }

      get songs() {
        return this.#ids.map((id) => this.#library.getSong(id)).filter(Boolean);
      }

      #read() {
        try {
          const saved = JSON.parse(localStorage.getItem(this.#key));
          return Array.isArray(saved) ? saved.filter((id) => this.#library.getSong(id)).slice(0, HOME_RECENT_COUNT) : [];
        } catch { return []; }
      }
    }

    /* ---- services/DurationPrefetcher.js ---- */
    /**
     * Mengambil durasi asli semua lagu dari SoundCloud di latar belakang (tanpa memutar),
     * memakai widget tersembunyi kedua, satu lagu per giliran. Hasilnya memperbaiki durasi di daftar lagu
     * tanpa harus memutar tiap lagu lebih dulu.
     */
    class DurationPrefetcher {
      constructor({ soundCloud, songs, bus }) {
        this.sc = soundCloud;
        this.songs = songs;
        this.bus = bus;
        // READY harus didengarkan sejak widget dibuat; jika baru didengarkan nanti, event-nya sudah terlewat.
        this.ready = new Promise((resolve) => this.sc.onReady(resolve));
      }

      async start() {
        await Promise.race([this.ready, new Promise((resolve) => setTimeout(resolve, TIMING.PREFETCH_READY_MS))]);
        // ID berawalan "p" = playlist SoundCloud; durasinya baru jelas saat lagu diputar.
        // Lagu yang durasinya belum diketahui (0) diukur lebih dulu, lalu sisanya.
        /* Durasi yang sudah tersimpan di cache tidak diukur ulang di setiap kunjungan. */
        const cached = DurationCache.read();
        const queue = this.songs
          .filter((song) => song.isPlayable && !String(song.soundCloudId).startsWith('p') && !(cached[song.soundCloudId] > 0))
          .sort((a, b) => (a.duration > 0) - (b.duration > 0));
        for (const song of queue) {
          const seconds = await this.#measure(song);
          if (seconds > 0) {
            DurationCache.save(song.soundCloudId, seconds);
            if (Math.abs(seconds - song.duration) >= 0.5) {
              song.duration = seconds;
              this.bus.emit(Events.PLAYER_DURATION, { song, seconds });
            }
          }
        }
      }

      /** Dua kali percobaan; hasil hanya dipakai jika track yang terbaca memang lagu yang diminta. */
      async #measure(song) {
        for (let attempt = 0; attempt < 2; attempt += 1) {
          const seconds = await this.#measureOnce(song);
          if (seconds > 0) return seconds;
        }
        return 0;
      }

      #measureOnce(song) {
        return new Promise((resolve) => {
          const timeout = setTimeout(() => resolve(0), TIMING.PREFETCH_TIMEOUT_MS);
          this.sc.load(song.soundCloudId, async () => {
            const sound = await this.sc.getCurrentSound();
            clearTimeout(timeout);
            const matches = sound && String(sound.id) === String(song.soundCloudId);
            resolve(matches && sound.duration > 0 ? sound.duration / 1000 : 0);
          }, false);
        });
      }
    }

    /* ---- views/BaseView.js ---- */
    /**
     * Kelas dasar halaman. Subclass mengimplementasikan render(route) dan mengembalikan:

     * `songs` adalah daftar lagu yang tampil di halaman; ia menjadi antrean saat pengguna menekan play.

    class BaseView {
      constructor(library) {

      }

      render() {
        throw new Error(`${this.constructor.name} harus mengimplementasikan render()`);

      /** Hasil standar untuk halaman tanpa daftar lagu yang bisa diputar. */

    class HomeView extends BaseView {
      #recommended;

      constructor(library, recent) {
        super(library);
        this.recent = recent;
        /* Diacak sekali saat web dimuat: tetap sama selama berpindah halaman, berganti saat refresh. */
        this.#recommended = shuffle(library.songs.filter((song) => song.isPlayable)).slice(0, HOME_RECOMMENDED_COUNT);
      }

      render() {
        const { songs } = this.library;
        const recent = this.recent.songs;
        const hero = '<section class="love"><i class="fa-solid fa-heart"></i><div><small>Untuk kamu</small>' +
          `<h1>${e(ARTIST_NAME)}</h1><p>Semua lagunya ada di sini, khusus untuk didengarkan olehmu.</p></div></section>`;
        const recommended = this.#recommended.length
          ? CardGrid(this.#recommended.map(SongCard).join(''))
          : EmptyState('fa-music', MESSAGES.NO_SONGS);
        const recentHtml = recent.length
          ? CardGrid(recent.map(SongCard).join(''))
          : `<p style="color:var(--muted)">${MESSAGES.NO_RECENT}</p>`;
        const html = hero
          + Section('Pilihan untukmu', recommended)
          + Section('Terakhir diputar', recentHtml);
        return BaseView.page(html, songs);
      }
    }

    class SongsView extends BaseView {
      render() {
        const songs = this.library.sortedSongs();
        const body = songs.length ? TrackList(songs) : EmptyState('fa-music', MESSAGES.NO_SONGS);
        return BaseView.page(SectionTitle('Lagu') + body, songs);
      }
    }

    /* ---- views/SearchView.js ---- */
    class SearchView extends BaseView {
      constructor(library, searchService) {
        super(library);
        this.searchService = searchService;
      }

      render({ query }) {
        const songs = this.searchService.search(query);
        const title = `Hasil untuk “${stripHtmlChars(query)}”`;
        const body = songs.length ? TrackList(songs) : EmptyResult();
        return BaseView.page(SectionTitle(title) + body, songs);

    /* ---- views/index.js ---- */
    /**
     * Registry halaman: nama view (Route.view) -> instance View.
     * Menambah halaman baru = membuat kelas View + mendaftarkannya di sini.
     */
    /** Halaman Favorit: semua lagu yang ditandai love. Antrean putar = daftar favorit ini. */
    class FavoritesView extends BaseView {
      constructor(library, favorites) {
        super(library);
        this.favorites = favorites;
      }

      render() {
        const songs = this.favorites.songs;
        if (!songs.length) {
          return BaseView.page(SectionTitle('Favorit') + EmptyState('fa-heart', MESSAGES.NO_FAVORITES), songs);
        }
        const rows = songs.map((song, i) => {
          return FavoriteRow(song, i, this.favorites.keyOf(song));
        }).join('');
        const html = SectionTitle('Favorit') +
          '<div role="list"><div class="row fav head"><span>#</span><span>Judul</span>' +
          '<span class="c-t"><i class="fa-regular fa-clock"></i></span><span></span></div>' +
          rows + '</div>';
        return BaseView.page(html, songs);
      }
    }

    function createViews(library, searchService, recent, favorites) {
      return new Map([
        ['home', new HomeView(library, recent)],
        ['songs', new SongsView(library)],
        ['favorites', new FavoritesView(library, favorites)],
        ['search', new SearchView(library, searchService)],
      ]);

    /* ---- components/NavMenu.js ---- */
    /**
     * Basis menu navigasi. Dipakai oleh Sidebar (desktop/tablet) dan MobileTabs (ponsel);

     */
    class NavMenu extends Component {
      constructor(root, { router, bus }) {
        super(root);
        this.router = router;
        this.bus = bus;
      }

      renderItems() {
        return NAV_ITEMS.map(({ view, label, icon }) =>
          `<button class="nav-item" data-go="${view}"><i class="fa-solid ${icon}"></i><span>${label}</span></button>`
        ).join('');
      }

      bind() {
        this.listen(this.root, 'click', (event) => {
          const target = event.target.closest('[data-go]');
          if (!target) return;
          const view = target.dataset.go;
          /* Pindah dari menu lain: buka lagi detail terakhir menu ini. Klik menu yang sedang aktif: kembali ke daftarnya. */
          this.router.navigate(view, { restore: this.router.current.section !== view });
        });
        this.subscribe(this.bus, Events.ROUTE_CHANGE, ({ route }) => this.highlight(route.section));
        this.highlight(this.router.current.section);
      }

      highlight(section) {
        this.$$('.nav-item').forEach((item) => item.classList.toggle('active', item.dataset.go === section));
      }
    }

    /* ---- components/SearchBar.js ---- */

    /* ---- components/Toast.js ---- */

    class Toast extends Component {
      #timer = null;

      constructor(root, { bus }) {

    /* ---- components/ViewOutlet.js ---- */
    /**
     * Area konten utama. Memilih View berdasarkan route, menampilkan hasilnya,
     * menangani klik di dalam konten (navigasi / putar lagu), dan menyelaraskan
     * penanda "sedang diputar" dengan state player.
     *
     * root = elemen <main> (berisi tab, #view, dan footer statis dari index.html).
     */
    class ViewOutlet extends Component {
      #songs = [];
      #route = null;
      #refreshTimer = null;

      constructor(root, { catalog, router, player, bus, favorites }) {
        super(root);
        this.favorites = favorites;
        /** Katalog aplikasi: pustaka, pencarian, riwayat, dan tampilan. */
        this.catalog = catalog;
        this.router = router;
        this.player = player;
        this.bus = bus;
        this.container = root.querySelector('#view');
      }

      get views() {
        return this.catalog.views;
      }

      bind() {
        this.listen(this.container, 'click', (event) => this.#onClick(event));
        this.#bindSwipe();
        this.subscribe(this.bus, Events.ROUTE_CHANGE, ({ route, source }) => this.show(route, source === 'page'));
        this.subscribe(this.bus, Events.PLAYER_STATE, (state) => this.#syncPlayback(state));
        this.subscribe(this.bus, Events.FAVORITES_CHANGE, () => {
          this.player.syncFavoritesQueue(this.favorites.songs);
          this.#refreshFavorites();
        });
        this.subscribe(this.bus, Events.PLAYER_DURATION, ({ song, seconds }) => {
          this.#updateDuration(song.id, seconds);
          this.#scheduleTotalsRefresh();
        });
      }

      /** Geser kiri/kanan untuk pindah antar halaman utama (Home, Songs, Favorites). */
      #bindSwipe() {
        const MIN_DISTANCE = 60;
        const MAX_MS = 800;
        let start = null;

        /** True jika sentuhan dimulai di elemen yang bisa digulir mendatar (mis. bar tab), agar gesturnya tidak bentrok. */
        const inHorizontalScroller = (el) => {
          for (let node = el; node && node !== this.root; node = node.parentElement) {
            if (node.scrollWidth > node.clientWidth && /(auto|scroll)/.test(getComputedStyle(node).overflowX)) return true;
          }
          return false;
        };

        this.listen(this.root, 'touchstart', (event) => {
          const touch = event.touches[0];
          start = event.touches.length === 1 && !inHorizontalScroller(event.target)
            ? { x: touch.clientX, y: touch.clientY, time: Date.now() }
            : null;
        }, { passive: true });

        this.listen(this.root, 'touchend', (event) => {
          if (!start) return;
          const touch = event.changedTouches[0];
          const dx = touch.clientX - start.x;
          const dy = touch.clientY - start.y;
          const fast = Date.now() - start.time <= MAX_MS;
          start = null;
          if (!fast || Math.abs(dx) < MIN_DISTANCE || Math.abs(dx) < Math.abs(dy) * 1.5) return;

          /* Hasil pencarian dianggap berada di menu Songs, jadi tetap bisa digeser ke halaman sebelah. */
          const currentView = this.#route?.view === 'search' ? 'songs' : this.#route?.view;
          const index = NAV_ITEMS.findIndex((item) => item.view === currentView);
          if (index === -1) return; // hanya halaman utama dan hasil pencarian, bukan halaman detail
          const target = NAV_ITEMS[index + (dx < 0 ? 1 : -1)];
          if (target) this.router.navigate(target.view);
        }, { passive: true });

        this.listen(this.root, 'touchcancel', () => { start = null; }, { passive: true });
      }

      show(route, scrollToBottom = false) {
        const view = this.views.get(route.view);
        const rendered = view.render(route);
        const { songs } = rendered;
        /* Detail yang tidak ditemukan (id salah atau sudah dihapus): tampilkan pesan, bukan halaman kosong. */
        const html = rendered.html
          || BackButton('home', 'Beranda') + '<p style="color:var(--muted);margin-top:16px">Halaman tidak ditemukan.</p>';
        this.#route = route;
        this.container.innerHTML = html;
        this.#songs = songs;
        /* Klik pagination: langsung berada di paling bawah tanpa animasi gulir (pagination ada di bawah daftar); halaman lain mulai dari atas. */
        this.root.scrollTo({ top: scrollToBottom ? this.root.scrollHeight : 0, behavior: 'instant' });
        this.#syncPlayback(this.player.state);
      }

      /** Daftar Favorites digambar ulang di tempat (tanpa lompat ke atas) saat ada lagu ditambah/dihapus. */
      #refreshFavorites() {
        if (this.#route?.view !== 'favorites') return;
        const top = this.root.scrollTop;
        const { html, songs } = this.views.get('favorites').render(this.#route);
        this.container.innerHTML = html;
        this.#songs = songs;
        this.root.scrollTo({ top, behavior: 'instant' });
        this.#syncPlayback(this.player.state);
      }

      #onClick(event) {
        const favTarget = event.target.closest('[data-fav]');
        if (favTarget) {
          const song = this.#songs.find((item) => String(this.favorites.keyOf(item)) === favTarget.dataset.fav);
          if (song) this.favorites.toggle(song);
          return;
        }

        const goTarget = event.target.closest('[data-go]');
        if (goTarget) return this.router.navigate(goTarget.dataset.go);

        const playTarget = event.target.closest('[data-play]');
        if (!playTarget) return;
        const songId = Number(playTarget.dataset.play);
        if (this.player.isCurrent(songId)) this.player.toggle();
        else this.player.playFrom(this.#songs, songId, this.#route?.view === 'favorites' ? 'favorites' : null);
      }

      #syncPlayback({ activeId, playing }) {
        this.container.querySelectorAll('[data-play]').forEach((el) => {
          const active = activeId !== null && Number(el.dataset.play) === activeId;
          el.classList.toggle('playing', active);
          const icon = el.querySelector('i');
          if (icon) icon.className = `fa-solid ${active && playing ? 'fa-pause' : 'fa-play'}`;
        });
      }

      /** Total durasi di header dihitung dari durasi lagu; segarkan setelah durasi baru masuk. */
      #scheduleTotalsRefresh() {
        const hero = this.container.querySelector('.hero p');
        if (!hero || !this.#route) return;
        clearTimeout(this.#refreshTimer);
        this.#refreshTimer = setTimeout(() => {
          const view = this.views.get(this.#route.view);
          const { html } = view.render(this.#route);
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const fresh = doc.querySelector('.hero p');
          const current = this.container.querySelector('.hero p');
          if (fresh && current) current.innerHTML = fresh.innerHTML;
        }, TIMING.REFRESH_DEBOUNCE_MS);
      }

      #updateDuration(songId, seconds) {
        this.container.querySelectorAll(`[data-play="${songId}"] .c-t`)
          .forEach((cell) => { cell.textContent = formatTime(seconds); });
      }
    }

    /* ---- components/PlayerBar.js ---- */

    class PlayerBar extends Component {
