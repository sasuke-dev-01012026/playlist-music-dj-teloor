              <div class="now-desc" id="nowDesc"></div>
            </div>
            <button class="fav-btn" id="nowFav" aria-label="Tambah ke Favorites" title="Tambah ke Favorites"><i class="fa-regular fa-heart"></i></button>
          </div>
          <div class="controls">
            <div class="btns">
              <button class="ctl" id="shuffle" aria-label="Shuffle"><i class="fa-solid fa-shuffle"></i></button>
              <button class="ctl" id="backward" aria-label="Previous"><i class="fa-solid fa-backward-step"></i></button>
              <button class="ctl" id="play" aria-label="Play"><i class="fa-solid fa-play"></i></button>
              <button class="ctl" id="forward" aria-label="Next"><i class="fa-solid fa-forward-step"></i></button>
              <button class="ctl" id="repeat" aria-label="Repeat"><i class="fa-solid fa-repeat"></i></button>
            </div>
            <div class="seek">
              <span class="time" id="cur">0:00</span>
              <input type="range" id="progressBar" min="0" max="100" step="0.1" value="0" aria-label="Progress">
              <span class="time" id="dur">--:--</span>
            </div>
          </div>
          <div class="extra">
            <a class="sc-credit" href="https://soundcloud.com" target="_blank" rel="noopener">via SoundCloud</a>
            <i class="fa-solid fa-volume-high" id="volIcon"></i>
            <input type="range" id="vol" min="0" max="1" step="0.01" value="1" aria-label="Volume">
          </div>`;
      }

      bind() {
        this.el = {
          img: this.$('#nowImg'), title: this.$('#nowTitle'), desc: this.$('#nowDesc'), fav: this.$('#nowFav'),
          play: this.$('#play'), shuffle: this.$('#shuffle'), repeat: this.$('#repeat'),
          progress: this.$('#progressBar'), cur: this.$('#cur'), dur: this.$('#dur'),
          vol: this.$('#vol'), volIcon: this.$('#volIcon'),
        };

        this.listen(this.el.play, 'click', () => this.player.toggle());
        this.listen(this.el.fav, 'click', () => {
          const song = this.player.currentSong;
          if (song) this.favorites.toggle(song);
        });
        this.subscribe(this.bus, Events.FAVORITES_CHANGE, () => this.#showFavorite(this.player.currentSong));
        this.listen(this.$('#forward'), 'click', () => this.player.step(1));
        this.listen(this.$('#backward'), 'click', () => this.player.step(-1));
        this.listen(this.el.shuffle, 'click', () => this.player.toggleShuffle());
        this.listen(this.el.repeat, 'click', () => this.player.toggleRepeat());
        this.listen(this.el.progress, 'input', () => {
          paintRange(this.el.progress, this.el.progress.value);
          this.player.seekToPercent(Number(this.el.progress.value));
        });
        this.listen(this.el.vol, 'input', () => this.#applyVolume(Number(this.el.vol.value)));
        this.listen(this.el.volIcon, 'click', () => {
          /* Bisukan lalu nyalakan lagi: kembali ke volume sebelumnya, bukan selalu 100%. */
          if (this.player.volume) this.lastVolume = this.player.volume;
          const next = this.player.volume ? 0 : (this.lastVolume || 1);
          this.el.vol.value = next;
          this.#applyVolume(next);
        });

        this.subscribe(this.bus, Events.PLAYER_TRACK, (song) => this.#showTrack(song));
        this.subscribe(this.bus, Events.PLAYER_STATE, (state) => this.#showState(state));
        this.subscribe(this.bus, Events.PLAYER_RESET, ({ song, state }) => {
          this.#showTrack(song);
          this.#showState(state);
          this.#showProgress({ percent: 0, seconds: 0 });
        });
        this.subscribe(this.bus, Events.PLAYER_PROGRESS, (p) => this.#showProgress(p));
        this.subscribe(this.bus, Events.PLAYER_DURATION, ({ song, seconds }) => {
          if (song.id === this.player.currentSong?.id) this.el.dur.textContent = formatTime(seconds);
        });

        this.#showTrack(this.player.currentSong);
        this.#showState(this.player.state);
        this.el.vol.value = this.player.volume;
        this.#applyVolume(this.player.volume);
      }

      /** Ikon love: default abu-abu; pink + terisi bila lagu yang tampil sudah difavoritkan. */
      #showFavorite(song) {
        const on = this.favorites.has(song);
        this.el.fav.classList.toggle('on', on);
        this.el.fav.disabled = !song;
        this.el.fav.querySelector('i').className = `fa-${on ? 'solid' : 'regular'} fa-heart`;
        const label = on ? 'Hapus dari Favorites' : 'Tambah ke Favorites';
        this.el.fav.setAttribute('aria-label', label);
        this.el.fav.setAttribute('aria-pressed', String(on));
        this.el.fav.title = label;
      }

      #showTrack(song) {
        this.#showFavorite(song);
        if (!song) {
          this.el.img.src = PLACEHOLDER_IMG;
          this.el.title.textContent = '';
          this.el.desc.textContent = '';
          this.el.dur.textContent = '--:--';
          return;
        }
        this.el.img.src = song.cover;
        this.el.title.textContent = song.name;
        this.el.desc.textContent = `${song.artist.name}`;
        this.el.dur.textContent = formatDuration(song.duration);
      }

      #showState({ playing, shuffle, repeat }) {
        this.el.play.firstElementChild.className = `fa-solid ${playing ? 'fa-pause' : 'fa-play'}`;
        this.el.shuffle.classList.toggle('active', shuffle);
        this.el.repeat.classList.toggle('active', repeat);
      }

      #showProgress({ percent, seconds }) {
        this.el.progress.value = percent;
        paintRange(this.el.progress, percent);
        this.el.cur.textContent = formatTime(seconds);
      }

      #applyVolume(volume) {
        this.player.setVolume(volume);
        paintRange(this.el.vol, volume * 100);
        const icon = volume === 0 ? 'fa-volume-xmark' : volume < 0.5 ? 'fa-volume-low' : 'fa-volume-high';
        this.el.volIcon.className = `fa-solid ${icon}`;
      }
    }

    /* ---- components/KeyboardShortcuts.js ---- */
    /** Spasi = play/pause, kecuali fokus sedang berada di input atau tombol. */
    class KeyboardShortcuts extends Component {
      constructor(root, { player }) {
        super(root);
        this.player = player;
      }

      bind() {
        this.listen(this.root, 'keydown', (event) => {
          if (event.code !== 'Space' || /INPUT|BUTTON/.test(document.activeElement.tagName)) return;
          event.preventDefault();
          this.player.toggle();
        });
      }
    }

    /* ################ APP          ################ */

    /* ---- App.js ---- */
    /**
     * Composition root: satu-satunya tempat yang membuat objek dan menyambungkan dependensinya
     * (dependency injection manual). Kelas lain hanya menerima apa yang mereka butuhkan lewat constructor.
     */
    class App {
      start() {
        const bus = new EventBus();
        const router = new Router(bus);
        const favorites = new FavoritesStore({ bus });

        COLORS = MUSIC_DATA.colors;
        const library = new MusicLibrary(MUSIC_DATA);
        DurationCache.apply(library.songs);
        favorites.register(library);
        const searchService = new SearchService(library);
        const recent = new RecentlyPlayed({ library, bus });
        const views = createViews(library, searchService, recent, favorites);
        const catalog = { library, searchService, recent, views };

        const player = new PlayerController({
          soundCloud: new SoundCloudPlayer(byId('sc')),
          bus,
          songs: library.songs,
        });

        const deps = { router, bus };
        this.components = [
          new Navbar(byId('navbar'), deps),
          new Sidebar(byId('sidebar'), deps),
          new MobileTabs(byId('tabs'), deps),
          new ViewOutlet(byId('main'), { catalog, router, player, bus, favorites }),
          new PlayerBar(byId('player'), { player, bus, favorites }),
          new Toast(byId('toast'), { bus }),
          new KeyboardShortcuts(document, { player }),
        ];
        this.components.forEach((component) => component.mount());

        router.start();
        if (library.songs.length) setTimeout(() => this.#prefetchDurations(library, bus), 0);
      }

      /** Widget SoundCloud kedua (tersembunyi, tanpa suara) khusus untuk membaca durasi asli lagu. */
      #prefetchDurations(library, bus) {
        const probe = document.createElement('iframe');
        probe.title = 'SoundCloud duration probe';
        probe.setAttribute('aria-hidden', 'true');
        probe.style.cssText = 'position:fixed;right:0;bottom:0;width:300px;height:166px;border:0;opacity:0;pointer-events:none;z-index:-1';
        probe.src = byId('sc').src;
        document.body.appendChild(probe);
        const probePlayer = new SoundCloudPlayer(probe);
        if (!probePlayer.available) return probe.remove();
        const prefetcher = new DurationPrefetcher({ soundCloud: probePlayer, songs: library.songs, bus });
        setTimeout(() => prefetcher.start(), TIMING.PREFETCH_START_MS);
      }
    }

    /* ---- main.js ---- */
    new App().start();

  </script>
</body>
